{{- $db := .Values.backend.database.external }}
{{- if and $db.enabled (not $db.existingSecret) $db.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sevaro-pulse.backend.dbSecretName" . }}
  labels:
    {{- include "sevaro-pulse.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  {{ $db.existingSecretKey }}: {{ $db.url | quote }}
{{- end }}
