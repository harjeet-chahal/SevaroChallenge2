{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- range $component := list "backend" "frontend" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include (printf "sevaro-pulse.%s.fullname" $component) $ }}
  labels:
    {{- include "sevaro-pulse.componentLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sevaro-pulse.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Browser traffic arrives only through the ingress controller.
    - from:
        - namespaceSelector:
            {{- toYaml $np.ingressControllerNamespaceSelector | nindent 12 }}
          {{- with $np.ingressControllerPodSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - port: http
          protocol: TCP
    # `helm test` pods in this release.
    - from:
        - podSelector:
            matchLabels:
              {{- include "sevaro-pulse.selectorLabels" (dict "ctx" $ "component" "test") | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
{{- end }}
