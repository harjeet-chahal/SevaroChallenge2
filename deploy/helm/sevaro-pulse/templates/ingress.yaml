{{- if .Values.ingress.enabled }}
{{- $ing := .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sevaro-pulse.fullname" . }}
  labels:
    {{- include "sevaro-pulse.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $ing.tls.enabled }}
  tls:
    - hosts:
        - {{ $ing.host | quote }}
      secretName: {{ $ing.tls.secretName }}
  {{- end }}
  rules:
    - {{- with $ing.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        # Same split as deploy/Caddyfile: API and its docs to the backend, the rest to the UI.
        # Longest prefix wins, so "/" only catches what the backend paths don't.
        paths:
          {{- range $ing.backendPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "sevaro-pulse.backend.fullname" $ }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sevaro-pulse.frontend.fullname" $ }}
                port:
                  name: http
{{- end }}
