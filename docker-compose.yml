# Reproducible local run. NOTE: written for convenience; not exercised on the build machine
# (Docker was not available there). The supported path is README "Run it".
services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:///./data/neurogrid.db
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes:
      - backend-data:/app/data
      - ./data:/dataset:ro
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  backend-data:
